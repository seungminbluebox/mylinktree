<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About ME</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png" />
    <link rel="stylesheet" href="./src/main.css" />
    <script type="module" src="./js.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-12 px-4 flex justify-center items-center">
    <!-- Main Container: Mobile focus on profile, Desktop side-by-side -->
    <div class="max-w-6xl w-full flex flex-col lg:flex-row gap-8 items-start">
      
      <!-- Profile Area (Sticky on Desktop) -->
      <div class="w-full lg:w-96 lg:sticky lg:top-12 flex-shrink-0">
        <div class="glass-morphism rounded-3xl p-8 flex flex-col items-center">
          <!-- Profile Section -->
          <div class="relative mb-6">
            <div class="absolute inset-0 bg-blue-400 rounded-full blur-xl opacity-20"></div>
            <a href="index.html" class="block relative group">
              <img
                id="profile"
                src="img/profile.jpg"
                alt="Profile"
                class="w-32 h-32 rounded-full border-4 border-white shadow-lg group-hover:scale-105 transition-transform duration-300 object-cover"
              />
            </a>
          </div>

          <h1 class="text-2xl font-bold mb-2 text-slate-800 text-center">승민's Profile</h1>
          <p class="text-blue-600 font-medium mb-8 italic text-center">"R=VD"</p>

          <!-- SNS Links -->
          <div class="w-full space-y-3 text-left">
            <a
              href="https://www.instagram.com/box._.min/"
              class="btn-hover flex items-center justify-between w-full p-4 bg-white/80 rounded-2xl border border-slate-100 group"
            >
              <div class="flex items-center gap-3">
                <img class="w-6 h-6" src="img/instagram.webp" alt="Insta" />
                <span class="font-semibold text-slate-700">Instagram</span>
              </div>
              <span class="text-xs text-slate-400 group-hover:text-blue-500">@box._.min →</span>
            </a>

            <a
              href="https://bluebox25.tistory.com/"
              class="btn-hover flex items-center justify-between w-full p-4 bg-white/80 rounded-2xl border border-slate-100 group"
            >
              <div class="flex items-center gap-3">
                <img class="w-6 h-6" src="img/tstory.png" alt="Tistory" />
                <span class="font-semibold text-slate-700">T-story</span>
              </div>
              <span class="text-xs text-slate-400 group-hover:text-blue-500">NotePad📝 →</span>
            </a>

            <a
              href="https://github.com/seungminbluebox"
              class="btn-hover flex items-center justify-between w-full p-4 bg-slate-800 text-white rounded-2xl shadow-md group"
            >
              <div class="flex items-center gap-3">
                <img class="w-6 h-6 invert" src="img/github.webp" alt="Github" />
                <span class="font-semibold">GitHub</span>
              </div>
              <span class="text-xs text-slate-400 group-hover:text-white">BlueBox →</span>
            </a>
          </div>

          <!-- Tooltip Original Favicon -->
          <div class="mt-8 pt-6 border-t border-slate-100 w-full flex justify-center">
            <div class="group relative cursor-help">
              <img class="opacity-30 hover:opacity-100 transition-opacity w-6 h-6" src="img/information.png" />
              <div
                class="absolute bottom-full left-1/2 -translate-x-1/2 mb-4 hidden group-hover:block w-48 p-4 bg-white rounded-2xl shadow-2xl border border-slate-100 z-50 transition-all scale-95 group-hover:scale-100"
              >
                <div class="text-[10px] text-slate-400 mb-2 text-center text-nowrap">탭 상단 favicon 원본 이미지</div>
                <img class="w-full aspect-square rounded-lg mb-2 shadow-inner" src="img/favicon.png" />
                <div class="text-xs font-bold text-center text-slate-600">우리집 강아지 써니 🐶</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Projects Area (Flexible Right side) -->
      <div class="flex-1 w-full flex flex-col gap-6">
        <div class="glass-morphism rounded-3xl p-8 min-h-[500px]">
          <h2 class="text-xl font-bold mb-8 flex items-center gap-3 text-slate-800">
            <span class="w-2 h-8 bg-blue-500 rounded-full"></span>
            PROJECTS TIMELINE
          </h2>
          <div id="projects-container" class="w-full space-y-12">
            <!-- Loading State -->
            <div class="animate-pulse space-y-8">
              <div class="h-6 bg-slate-200 rounded w-24"></div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="h-32 bg-slate-100 rounded-2xl"></div>
                <div class="h-32 bg-slate-100 rounded-2xl"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  </body>
</html>
